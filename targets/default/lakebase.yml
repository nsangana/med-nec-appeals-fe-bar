# DEFAULT TARGET ONLY (not deployed to smoke). Lakebase Autoscaling (postgres_*). Follows bundle-examples
# knowledge_base/database_with_catalog (project / branch / endpoint / database / UC catalog).
# Every object is BOUND to the live object with `bundle deployment bind` (no replace_existing: nothing is created).
# Roles are NOT declared: the owner role is a personal identity and the app SP role is created by the app's
# postgres resource binding (lakebase/APP_GRANTS.md).
# Parent / branch paths are built from var.lakebase_project (no resource references: they are not resolved
# at validate time).
# The synced table keeps its existing refresh pipeline (existing_pipeline_id); lakebase/create_synced_table.sh
# created it with new_pipeline_spec. The Lakebase sync is not re-created by this file.
targets:
  default:
    resources:
      postgres_projects:
        fe_bar_lakebase_project:
          project_id: ${var.lakebase_project}
          display_name: ${var.lakebase_project}
          pg_version: 17
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 0.5
            suspend_timeout_duration: 300s
          lifecycle:
            prevent_destroy: true

      postgres_branches:
        fe_bar_lakebase_production:
          parent: projects/${var.lakebase_project}
          branch_id: production
          is_protected: false
          no_expiry: true
          lifecycle:
            prevent_destroy: true

      postgres_endpoints:
        fe_bar_lakebase_primary:
          parent: projects/${var.lakebase_project}/branches/production
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 0.5
          autoscaling_limit_max_cu: 0.5
          suspend_timeout_duration: 300s
          group:
            min: 1
            max: 1
            enable_readable_secondaries: false
          lifecycle:
            prevent_destroy: true

      postgres_databases:
        fe_bar_lakebase_appeals_db:
          parent: projects/${var.lakebase_project}/branches/production
          database_id: appeals
          postgres_database: appeals
          lifecycle:
            prevent_destroy: true

      postgres_catalogs:
        fe_bar_lakebase_catalog:
          catalog_id: ${var.lakebase_catalog}
          branch: projects/${var.lakebase_project}/branches/production
          postgres_database: appeals
          create_database_if_missing: false
          lifecycle:
            prevent_destroy: true

      postgres_synced_tables:
        fe_bar_worklist_serving:
          synced_table_id: ${var.lakebase_catalog}.${var.schema}.worklist_serving
          source_table_full_name: ${var.catalog}.${var.schema}.worklist_serving
          branch: projects/${var.lakebase_project}/branches/production
          postgres_database: appeals
          primary_key_columns:
            - FACILITY_ID
            - PATIENT_CONTROL_NUMBER
            - ENCOUNTER_NBR
          scheduling_policy: TRIGGERED
          create_database_objects_if_missing: true
          existing_pipeline_id: 0245f1ce-9b6c-49c9-88ae-1942576611d7
          lifecycle:
            prevent_destroy: true
